app-id: app.missioncontrol.MissionControlApp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: missioncontrol_app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.*
modules:
  - name: missioncontrol_app
    buildsystem: simple
    build-commands:
      - install -Dm755 missioncontrol_app /app/bin/missioncontrol_app
      - mkdir -p /app/bin/lib /app/bin/data /app/share/applications /app/share/icons/hicolor/128x128/apps
      - cp -r lib/* /app/bin/lib/
      - cp -r data/* /app/bin/data/
      - install -Dm644 app.missioncontrol.MissionControlApp.desktop /app/share/applications/app.missioncontrol.MissionControlApp.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/128x128/apps/app.missioncontrol.MissionControlApp.png
    sources:
      - type: dir
        path: ../frontend/build/linux/x64/release/bundle
