app-id: app.missioncontrol.MissionControlApp
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: missioncontrol_app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home
modules:
  - name: missioncontrol_app
    buildsystem: simple
    build-commands:
      - install -Dm755 missioncontrol_app /app/bin/missioncontrol_app
      - mkdir -p /app/bin/lib /app/bin/data
      - cp -r lib/* /app/bin/lib/
      - cp -r data/* /app/bin/data/
    sources:
      - type: dir
        path: ../frontend/build/linux/x64/release/bundle
